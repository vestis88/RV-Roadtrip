name: CI

on:
  push:
    branches: [main, claude/master-plan-docs-drokop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Write emulator-mode .env for build/test steps
        run: |
          cat <<'EOF' > .env
          VITE_FIREBASE_API_KEY=demo-key
          VITE_FIREBASE_AUTH_DOMAIN=demo-rv-trip-planner.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=demo-rv-trip-planner
          VITE_FIREBASE_STORAGE_BUCKET=demo-rv-trip-planner.appspot.com
          VITE_FIREBASE_APP_ID=demo-app-id
          VITE_USE_FIREBASE_EMULATORS=true
          EOF

      - run: npm ci
      - run: npm run lint
      - run: npm run test -w shared
      # @rv/shared's package.json resolves via "main": "./dist/index.js" — any
      # frontend file with a value-level import from it (not just `import
      # type`) needs this built first, or Vite's resolver fails outright.
      - run: npm run build -w shared
      - run: npm run test
      - run: npm run build
      - run: npm run build -w functions
      - run: npm run test:functions
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Print Playwright error-context (page snapshot at failure) to the job log
        if: failure()
        run: |
          find test-results -name 'error-context.md' -print -exec echo '---' \; -exec cat {} \; -exec echo '---' \; || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    name: Deploy to Firebase (Hosting + Functions + Firestore rules)
    needs: build
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/master-plan-docs-drokop') &&
      vars.FIREBASE_PROJECT_ID != '' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Write production .env for the Hosting build
        run: |
          cat <<'EOF' > .env
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_USE_FIREBASE_EMULATORS=false
          EOF

      - run: npm ci
      - run: npm run build
      - run: npm run build -w functions

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # --force is what lets a deploy DELETE a function that no longer exists
      # in source. Without it, `firebase deploy` stops and asks — which in
      # CI means it aborts, and every subsequent deploy aborts too, on the
      # same removed function. That is exactly what happened when
      # refreshCountryGuide was replaced by researchCountrySections: six
      # consecutive pushes ran their tests green and then deployed nothing,
      # so the live app sat on a build from hours earlier while the branch
      # moved on. Hosting, functions and rules all deploy together here, so
      # one aborted function deletion silently withholds the frontend too.
      - name: Deploy to Firebase
        run: npx firebase-tools deploy --project ${{ vars.FIREBASE_PROJECT_ID }} --non-interactive --force
